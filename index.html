<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notes</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0f0f0e;--ink:#ecebe6;--mute:#78766f;--line:#2a2a27;--card:#181816;--g:150,235,170;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#tt,#bd,#q,#cin{-webkit-user-select:text;user-select:text}
::selection{background:transparent}
#tt::selection,#bd::selection{background:rgba(110,160,255,.38)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{--cw:0px;--cwo:400px;background:var(--bg);color:var(--ink);font-family:'Inter Tight',system-ui,-apple-system,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;padding-left:var(--cw);transition:padding-left .8s cubic-bezier(.16,1,.3,1),background .4s,color .4s}
body.chat{--cw:var(--cwo)}
body.resizing,body.resizing *{transition:none!important}
button,input,textarea{font:inherit;color:inherit;background:none;border:0;outline:0}
button{cursor:pointer}
nav{position:fixed;top:env(safe-area-inset-top,0px);left:var(--cw);right:0;z-index:20;display:flex;justify-content:flex-end;align-items:center;padding:22px 28px;font-size:14px;mix-blend-mode:difference;color:#fff;transition:left .8s cubic-bezier(.16,1,.3,1)}
nav .mid{display:flex;gap:6px;grid-column:2}
nav #new{grid-column:3;justify-self:end}
nav .mid button{opacity:.45;transition:opacity .3s}
nav .mid button.on,nav .mid button:hover{opacity:1}
.lnk{position:relative}.lnk:after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform .45s cubic-bezier(.7,0,.2,1)}
.lnk:hover:after{transform:scaleX(1);transform-origin:left}
main{padding:0 28px 120px;max-width:1500px;margin:0 auto}
.hero{height:15vh}
h1{font-size:clamp(48px,11vw,170px);line-height:.92;letter-spacing:-.045em;font-weight:500}
h1 .ln{display:block;overflow:hidden}
h1 .ln span{display:inline-block;transform:translateY(105%);animation:up 1.1s cubic-bezier(.16,1,.3,1) forwards}
h1 .ln:nth-child(2) span{animation-delay:.1s;color:var(--mute)}
@keyframes up{to{transform:none}}
.bar{display:flex;gap:16px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:16px 0;font-size:14px;color:var(--mute)}
.bar input{flex:1;color:var(--ink);font-size:14px}.bar input::placeholder{color:var(--mute)}
.reveal{opacity:0;transform:translateY(40px);animation:rv .9s cubic-bezier(.16,1,.3,1) forwards}
@keyframes rv{to{opacity:1;transform:none}}
/* grid */
#list.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--min,280px),1fr));gap:14px;margin-top:14px}
#list.grid .item{background:var(--card);border-radius:14px;aspect-ratio:4/5;padding:22px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;transition:transform .6s cubic-bezier(.16,1,.3,1),border-radius .6s}
#list.grid .item:hover{transform:scale(.97);border-radius:26px}
#list.grid .t{font-size:var(--fs,28px);letter-spacing:-.03em;line-height:1.05;font-weight:500}
#list.grid .sn{display:block;margin-top:14px;font-size:14px;color:var(--mute);line-height:1.4;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
#list.grid .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
/* list */
#list.rows .item{display:flex;width:100%;align-items:baseline;gap:24px;text-align:left;padding:18px 0;border-bottom:1px solid var(--line);transition:opacity .35s,padding .5s cubic-bezier(.16,1,.3,1)}
#list.rows:hover .item{opacity:.25}#list.rows .item:hover{opacity:1;padding-left:22px}
#list.rows .t{font-size:clamp(34px,6vw,92px);letter-spacing:-.04em;line-height:1;font-weight:500;flex:1}
#list.rows .sn{display:none}
#list.rows .meta{display:flex;gap:28px;font-size:13px;color:var(--mute)}
.item .meta .num{font-variant-numeric:tabular-nums}
.empty{padding:80px 0;color:var(--mute);font-size:20px;letter-spacing:-.02em}

#list[data-size=s] .sn{font-size:12px;-webkit-line-clamp:3}
#list[data-size=s] .item{padding:16px}
.sizes{display:flex;gap:2px}
.sz{width:28px;height:28px;display:grid;place-items:center;opacity:.35;transition:opacity .3s,transform .4s cubic-bezier(.34,1.5,.4,1)}
.sz.on,.sz:hover{opacity:1}.sz:active{transform:scale(.85)}
.sz svg{width:16px;height:16px;fill:currentColor}
#glass{position:fixed;z-index:21;top:calc(env(safe-area-inset-top,0px) + 14px);left:calc(50% + var(--cw)/2);transform:translateX(-50%);display:grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:999px;background:rgba(255,255,255,.07);-webkit-backdrop-filter:blur(16px) saturate(170%);backdrop-filter:blur(16px) saturate(170%);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(255,255,255,.04),0 8px 28px rgba(0,0,0,.35);transition:left .8s cubic-bezier(.16,1,.3,1)}
#glass button{position:relative;z-index:1;min-width:84px;padding:7px 18px;font-size:13px;border-radius:999px;color:var(--mute);transition:color .4s}
#glass button.on{color:var(--ink)}
#glass .th{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:999px;transition:transform .7s cubic-bezier(.34,1.45,.4,1),background .5s,box-shadow .5s;background:rgba(140,200,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 0 12px rgba(160,210,255,.25),0 2px 10px rgba(120,190,255,.25)}
#glass[data-tab=shanky] .th{transform:translateX(100%);background:rgba(115,60,190,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 0 12px rgba(160,110,230,.3),0 2px 10px rgba(110,60,190,.35)}
.glow{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity 1s}
.glow.a{background:radial-gradient(60% 40% at 50% 0%,rgba(130,195,255,.13),transparent 70%)}
.glow.b{background:radial-gradient(60% 40% at 50% 0%,rgba(115,60,190,.2),transparent 70%)}
body[data-tab=reece] .glow.a,body[data-tab=shanky] .glow.b{opacity:1}

.bar{position:relative;z-index:6}
.ctl{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.sortw{position:relative}
#sortb{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--mute);padding:4px 2px;transition:color .3s}
#sortb:hover{color:var(--ink)}
#sortb svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;transition:transform .45s cubic-bezier(.16,1,.3,1)}
.sortw.open #sortb svg{transform:rotate(180deg)}
#sortm{position:absolute;right:0;top:calc(100% + 8px);z-index:25;min-width:160px;padding:5px;border-radius:16px;background:rgba(40,40,38,.55);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 12px 36px rgba(0,0,0,.4);opacity:0;visibility:hidden;transform:translateY(-6px) scale(.96);transform-origin:top right;transition:opacity .3s,transform .5s cubic-bezier(.16,1,.3,1),visibility 0s .3s}
.sortw.open #sortm{opacity:1;visibility:visible;transform:none;transition:opacity .3s,transform .5s cubic-bezier(.16,1,.3,1)}
#sortm button{display:block;width:100%;text-align:left;padding:8px 12px;font-size:13px;border-radius:11px;color:var(--mute);transition:background .25s,color .25s}
#sortm button:hover,#sortm button.on{color:var(--ink);background:rgba(255,255,255,.09)}
#list[data-size=xs] .item{padding:11px;border-radius:10px}
#list[data-size=xs] .t{line-height:1.1}
#list .item.drag{z-index:7;transition:none!important;box-shadow:0 24px 60px rgba(0,0,0,.5)}
body.dragging{user-select:none;-webkit-user-select:none}
#dlg{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;visibility:hidden;transition:opacity .35s,visibility 0s .35s}
#dlg.on{opacity:1;visibility:visible;transition:opacity .35s}
#dlg .box{width:min(400px,calc(100% - 40px));padding:26px;border-radius:24px;background:rgba(40,40,38,.6);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 20px 60px rgba(0,0,0,.5);transform:translateY(16px) scale(.96);transition:transform .6s cubic-bezier(.16,1,.3,1)}
#dlg.on .box{transform:none}
#dm{font-size:24px;letter-spacing:-.03em;line-height:1.15;margin-bottom:24px;color:#ecebe6}
#db{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#db button{padding:9px 16px;border-radius:999px;font-size:13px;border:1px solid rgba(255,255,255,.2);color:#ecebe6;transition:background .3s}
#db button:hover{background:rgba(255,255,255,.1)}
#db button.pri{background:#ecebe6;color:#0f0f0e;border-color:transparent}
#db button.pri:hover{background:#fff}
/* editor */
#ed{position:fixed;top:0;bottom:0;right:0;left:var(--cw);z-index:30;background:var(--bg);overflow-y:auto;clip-path:inset(100% 0 0 0);visibility:hidden;transition:clip-path .8s cubic-bezier(.76,0,.24,1),left .8s cubic-bezier(.16,1,.3,1),visibility 0s .8s}
#ed.open{clip-path:inset(0);visibility:visible;transition:clip-path .8s cubic-bezier(.76,0,.24,1),left .8s cubic-bezier(.16,1,.3,1)}
#ed .in{max-width:900px;margin:0 auto;padding:calc(110px + env(safe-area-inset-top,0px)) 28px 120px;transform:translateY(40px);opacity:0;transition:.8s cubic-bezier(.16,1,.3,1) 0s}
#ed.open .in{transform:none;opacity:1;transition-delay:.35s}
#ed .top{position:fixed;top:env(safe-area-inset-top,0px);left:var(--cw);right:0;display:flex;justify-content:space-between;padding:22px 28px;font-size:14px;background:linear-gradient(var(--bg),transparent);transition:left .8s cubic-bezier(.16,1,.3,1)}
#ed .top .r{display:flex;gap:24px;align-items:center}
#sv{color:var(--mute);transition:opacity .4s}
#tt{width:100%;font-size:clamp(40px,8vw,96px);letter-spacing:-.045em;line-height:1;font-weight:500;resize:none;overflow:hidden;display:block}
#bd{width:100%;min-height:50vh;font-size:19px;line-height:1.65;resize:none;letter-spacing:-.005em;overflow:hidden;display:block}
::placeholder{color:var(--mute);opacity:.6}
/* cursor + splat */
#cur{position:fixed;left:0;top:0;z-index:99;pointer-events:none;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff;mix-blend-mode:difference;display:grid;place-items:center;transition:width .4s cubic-bezier(.16,1,.3,1),height .4s cubic-bezier(.16,1,.3,1),margin .4s cubic-bezier(.16,1,.3,1);opacity:0}
#cur.big{width:28px;height:28px;margin:-14px 0 0 -14px}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:98;pointer-events:none;mix-blend-mode:difference}
@media(hover:hover){*,*:hover{cursor:none!important}}
@media(hover:none){#cur{display:none}}
/* chat button */
#chatb{position:fixed;z-index:38;top:calc(env(safe-area-inset-top,0px) + 14px);left:20px;display:flex;padding:3px;border-radius:999px;background:rgba(255,255,255,.07);-webkit-backdrop-filter:blur(16px) saturate(170%);backdrop-filter:blur(16px) saturate(170%);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(255,255,255,.04),0 8px 28px rgba(0,0,0,.35)}
#chatb .th{position:absolute;inset:3px;border-radius:999px;background:rgba(150,235,170,.36);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 0 12px rgba(170,255,190,.28),0 2px 12px rgba(130,235,160,.32);transition:transform .6s cubic-bezier(.34,1.5,.4,1),box-shadow .5s}
#chatb:hover .th{transform:scale(1.04)}#chatb:active .th{transform:scale(.94)}
body.chat #chatb .th{box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 0 16px rgba(170,255,190,.4),0 2px 18px rgba(130,235,160,.5)}
#chatbtn{position:relative;z-index:1;display:flex;align-items:center;gap:7px;padding:7px 16px 7px 12px;font-size:13px;border-radius:999px;color:#effff3}
#chatbtn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.lb{display:grid}.lb em{grid-area:1/1;font-style:normal;transition:opacity .4s,transform .55s cubic-bezier(.16,1,.3,1)}
.lb em+em{opacity:0;transform:translateY(8px)}
body.chat .lb em:first-child{opacity:0;transform:translateY(-8px)}body.chat .lb em+em{opacity:1;transform:none}
#unr{position:absolute;z-index:2;top:-5px;right:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#8ff0ad;color:#0c1a10;font-size:11px;font-weight:600;display:grid;place-items:center;transform:scale(0);transition:transform .5s cubic-bezier(.34,1.8,.4,1)}
#unr.on{transform:scale(1);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(143,240,173,.0),0 0 14px rgba(143,240,173,.6)}}
/* chat panel */
#chat{position:fixed;left:0;top:0;bottom:0;width:var(--cwo);z-index:36;display:flex;flex-direction:column;overflow:hidden;background:rgba(16,19,17,.78);-webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%);border-right:1px solid rgba(255,255,255,.1);box-shadow:inset -1px 0 0 rgba(255,255,255,.05),30px 0 80px rgba(0,0,0,.45);transform:translateX(-104%);visibility:hidden;transition:transform .8s cubic-bezier(.16,1,.3,1),visibility 0s .8s}
body.chat #chat{transform:none;visibility:visible;transition:transform .8s cubic-bezier(.16,1,.3,1)}
#chat .bg{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#chat .bg i{position:absolute;width:320px;height:320px;border-radius:50%;filter:blur(60px);opacity:.22;animation:drift 16s ease-in-out infinite alternate}
#chat .bg i:nth-child(1){background:#6fe39b;left:-80px;top:-60px}
#chat .bg i:nth-child(2){background:#5fb4ff;right:-120px;bottom:80px;animation-delay:-6s;opacity:.15}
@keyframes drift{to{transform:translate(60px,90px) scale(1.2)}}
#chat>*:not(.bg){position:relative;z-index:1}
/* resize grip */
#grip{position:fixed;z-index:37;top:0;bottom:0;left:calc(var(--cw) - 7px);width:14px;touch-action:none;pointer-events:none;transition:left .8s cubic-bezier(.16,1,.3,1)}
body.chat #grip{pointer-events:auto}
#grip:after{content:"";position:absolute;top:50%;left:5px;width:4px;height:56px;margin-top:-28px;border-radius:2px;background:rgba(255,255,255,.3);opacity:0;transition:opacity .3s,height .4s cubic-bezier(.16,1,.3,1),background .3s,margin .4s cubic-bezier(.16,1,.3,1)}
#grip:hover:after,#grip.on:after{opacity:1}
#grip.on:after{height:84px;margin-top:-42px;background:rgba(150,235,170,.85)}
.hd{min-height:68px;border-bottom:1px solid rgba(255,255,255,.07)}
#msgs{flex:1;overflow-y:auto;padding:12px 18px;scrollbar-width:none}
#msgs::-webkit-scrollbar{display:none}
#ml{display:flex;flex-direction:column}
.ts{align-self:center;margin:14px 0 6px;font-size:11px;color:var(--mute);letter-spacing:.02em}
.row{display:flex;margin-top:2px;transition:opacity .3s}.row.mine{justify-content:flex-end}.row.first{margin-top:10px}
.m{position:relative;max-width:80%;padding:9px 14px;border-radius:20px;font-size:15px;line-height:1.4;overflow-wrap:anywhere;white-space:pre-wrap;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:box-shadow .3s}
.m.new{animation:pop .6s cubic-bezier(.34,1.56,.4,1) both}
.mine .m.new{transform-origin:100% 100%}.theirs .m.new{transform-origin:0 100%}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.7)}}
.theirs .m{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.mine .m{background:linear-gradient(160deg,rgba(150,235,170,.4),rgba(80,190,130,.2));border:1px solid rgba(190,255,205,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 22px rgba(90,200,140,.14);color:#f4fff7}
.mine:not(.first) .m{border-top-right-radius:7px}.mine:not(.tail) .m{border-bottom-right-radius:7px}
.theirs:not(.first) .m{border-top-left-radius:7px}.theirs:not(.tail) .m{border-bottom-left-radius:7px}
.m.big{background:none!important;border:0!important;box-shadow:none!important;padding:2px;font-size:0;-webkit-backdrop-filter:none;backdrop-filter:none}
.m.big .ej{width:46px;height:46px;margin:0 3px}
.ej{width:46px;height:46px;vertical-align:-16px;margin:0 3px;overflow:visible}
/* reply */
#msgs.rp .row:not(.sel){opacity:.42}
.row.sel .m{box-shadow:0 0 0 2px rgba(143,240,173,.95),0 0 24px rgba(143,240,173,.35)}
.row.sel .m.big{box-shadow:none;filter:drop-shadow(0 0 8px rgba(143,240,173,.9))}
.row.flash .m{animation:fl 1.1s}
@keyframes fl{30%{box-shadow:0 0 0 3px rgba(143,240,173,.9),0 0 30px rgba(143,240,173,.5)}}
.q{display:block;margin:-3px -7px 7px;padding:6px 10px;border-radius:13px;background:rgba(0,0,0,.24);border-left:3px solid #8ff0ad;font-size:13px;line-height:1.3;white-space:normal}
.q b{display:block;font-weight:500;font-size:12px;color:#8ff0ad;margin-bottom:1px}
.theirs .q{border-left-color:#9cc9ff}.theirs .q b{color:#9cc9ff}
.q span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:rgba(236,235,230,.78)}
.q .ej{width:15px;height:15px;vertical-align:-3px}
#rbar{display:none;align-items:center;gap:10px;margin:0 4px 8px;padding:8px 8px 8px 12px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-left:3px solid #8ff0ad;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#rbar.on{display:flex;animation:rb .4s cubic-bezier(.16,1,.3,1)}
@keyframes rb{from{opacity:0;transform:translateY(10px)}}
#rbar div{flex:1;min-width:0;font-size:13px;line-height:1.3}
#rbar b{display:block;font-weight:500;font-size:12px;color:#8ff0ad}
#rbar span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:rgba(236,235,230,.75)}
#rbar .ej{width:15px;height:15px;vertical-align:-3px}
#rx{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);transition:background .3s,transform .4s cubic-bezier(.34,1.6,.4,1)}
#rx:hover{background:rgba(255,255,255,.2);transform:rotate(90deg)}
#rx svg{width:11px;height:11px;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;fill:none}
/* ticks + typing */
.tk{display:inline-block;margin-left:8px;vertical-align:-2px;width:17px;height:11px;color:rgba(244,255,247,.45);transition:color .5s,filter .5s}
.tk svg{display:block;width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tk.seen{color:#4dff85;filter:drop-shadow(0 0 4px rgba(77,255,133,.85))}
.m.big .tk{vertical-align:bottom}
#typ{display:none;margin-top:10px}#typ.on{display:flex}
#typ .m{animation:pop .5s cubic-bezier(.34,1.56,.4,1) both;transform-origin:0 100%;display:flex;gap:5px;padding:14px 15px}
#typ i{width:7px;height:7px;border-radius:50%;background:#ecebe6;opacity:.45;animation:dj 1.2s ease-in-out infinite}
#typ i:nth-child(2){animation-delay:.16s}#typ i:nth-child(3){animation-delay:.32s}
@keyframes dj{30%{transform:translateY(-5px);opacity:1}}
/* emoji animation (chat only) */
.ej .bd,.ej .sp,.ej .hp,.ej .tr,.ej .zz,.ej .arm{transform-box:fill-box}
.ej .ey{transform-box:fill-box;transform-origin:50% 50%}
.ej .sp,.ej .hp,.ej .tr,.ej .zz{transform-origin:50% 50%}
.m .ej .bd{transform-origin:50% 100%;animation:br 3.2s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes br{50%{transform:scale(1.04,.95)}}
.m .ej .ey{animation:bl 4.6s infinite;animation-delay:var(--d,0s)}
@keyframes bl{0%,92%,100%{transform:none}95%{transform:scaleY(.1)}}
.m .ej .hp{animation:hp 1.2s ease-in-out infinite}
@keyframes hp{50%{transform:scale(1.25)}}
.m .ej .sp{animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.m .ej .tr{animation:tr 2.2s ease-in infinite;animation-delay:var(--d,0s)}
@keyframes tr{0%{transform:translateY(-1px);opacity:1}80%,100%{transform:translateY(7px);opacity:0}}

dth="5" height="5" rx=".5"/><rect x="2.00" y="8.00" width="5" height="5" rx=".5"/><rect x="8.00" y="8.00" width="5" height="5" rx=".5"/></svg></button><button class="sz" data-s="l" data-c="1" aria-label="Card size l"><svg viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="2"/></svg></button></div><div class="sortw"><button id="sortb" data-c="1"><span id="sortl">Last edited</span><svg viewBox="0 0 10 10"><path d="M2 3.5l3 3 3-3"/></svg></button><div id="sortm"><button data-k="edited" data-c="1">Last edited</button><button data-k="alpha" data-c="1">Alphabetical</button><button data-k="custom" data-c="1">Custom</button></div></div></div></div>

<script>
const $=s=>document.querySelector(s);
const KEYS={reece:'study-notes-v1',shanky:'study-notes-shanky-v1'};
const mem={};
function load(t){try{const r=localStorage.getItem(KEYS[t]);return r?JSON.parse(r):[]}catch(e){return mem[t]||[]}}
let tab='reece';try{const t=localStorage.getItem('study-notes-tab');if(KEYS[t])tab=t}catch(e){}
let notes=load(tab),cur=null,timer;
function save(){try{localStorage.setItem(KEYS[tab],JSON.stringify(notes))}catch(e){mem[tab]=notes}}
function applyTab(){document.body.dataset.tab=tab;$('#glass').dataset.tab=tab;document.querySelectorAll('#glass button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab))}
function setTab(t){if(t===tab)return;save();tab=t;notes=load(t);try{localStorage.setItem('study-notes-tab',t)}catch(e){}applyTab();$('#q').value='';render()}
document.querySelectorAll('#glass button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
const SIZES={xs:[112,13],s:[170,17],m:[280,28],l:[430,42]};
const LBL={edited:'Last edited',alpha:'Alphabetical',custom:'Custom'};
let sortMode='edited';try{const z=localStorage.getItem('study-notes-sort');if(LBL[z])sortMode=z}catch(e){}
let size='m';try{const z=localStorage.getItem('study-notes-size');if(SIZES[z])size=z}catch(e){}
function setSize(k){size=k;const l=$('#list');l.style.setProperty('--min',SIZES[k][0]+'px');l.style.setProperty('--fs',SIZES[k][1]+'px');l.dataset.size=k;document.querySelectorAll('.sz').forEach(b=>b.classList.toggle('on',b.dataset.s===k));try{localStorage.setItem('study-notes-size',k)}catch(e){}}
document.querySelectorAll('.sz').forEach(b=>b.onclick=()=>setSize(b.dataset.s));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short'});

function sorted(list){
  const a=[...list];
  if(sortMode==='alpha')a.sort((x,y)=>(x.title||'Untitled').localeCompare(y.title||'Untitled',undefined,{sensitivity:'base'}));
  else if(sortMode==='custom')a.sort((x,y)=>((x.order??0)-(y.order??0))||(y.updated-x.updated));
  else a.sort((x,y)=>y.updated-x.updated);
  return a;
}
function render(){
  if(sortMode==='custom'&&notes.some(n=>n.order==null)){[...notes].sort((x,y)=>y.updated-x.updated).forEach((n,i)=>n.order=i);save()}
  const q=$('#q').value.toLowerCase().trim();
  const arr=sorted(notes.filter(n=>!q||(n.title+n.body).toLowerCase().includes(q)));
  $('#sortl').textContent=LBL[sortMode];
  document.querySelectorAll('#sortm button').forEach(b=>b.classList.toggle('on',b.dataset.k===sortMode));
  const l=$('#list');l.className='grid';
  if(!arr.length){l.innerHTML='<div class="empty">'+(notes.length?'Nothing matches.':'No notes yet. Create your first one.')+'</div>';return}
  l.innerHTML=arr.map((n,i)=>`<button class="item reveal" data-id="${n.id}" data-c="1" style="animation-delay:${Math.min(i,12)*.06+.1}s"><div class="t">${esc(n.title||'Untitled')}</div></button>`).join('');
  l.querySelectorAll('.item').forEach(it=>it.addEventListener('animationend',()=>it.classList.remove('reveal'),{once:true}));
}
/* sort menu */
$('#sortb').onclick=e=>{e.stopPropagation();document.querySelector('.sortw').classList.toggle('open')};
document.addEventListener('click',()=>document.querySelector('.sortw').classList.remove('open'));
document.querySelectorAll('#sortm button').forEach(b=>b.onclick=()=>{
  const k=b.dataset.k;
  if(k==='custom'&&notes.some(n=>n.order==null)){sorted(notes).forEach((n,i)=>n.order=i);save()}
  sortMode=k;try{localStorage.setItem('study-notes-sort',k)}catch(e){}render();
});
/* dialog */
let resolveAsk=null;
function ask(msg,opts){return new Promise(res=>{
  $('#dm').textContent=msg;const d=$('#db');d.innerHTML='';
  const done=v=>{$('#dlg').classList.remove('on');resolveAsk=null;res(v)};
  opts.forEach(o=>{const b=document.createElement('button');b.textContent=o.l;b.dataset.c='1';if(o.p)b.className='pri';b.onclick=()=>done(o.v);d.appendChild(b)});
  resolveAsk=()=>done('cancel');$('#dlg').classList.add('on');
})}
/* editor (explicit save, prompt on leave) */
let snap={t:'',b:''};
const dirty=()=>cur&&($('#tt').value!==snap.t||$('#bd').value!==snap.b);
function open(id){
  const ex=id?notes.find(x=>x.id===id):null;
  cur=ex||{id:uid(),title:'',body:'',updated:Date.now(),order:Math.min(0,...notes.map(n=>n.order??0))-1,isNew:true};
  snap={t:cur.title,b:cur.body};$('#tt').value=cur.title;$('#bd').value=cur.body;
  $('#ed').classList.add('open');document.body.style.overflow='hidden';$('#sv').textContent='';
  setTimeout(()=>{grow();(cur&&cur.title?$('#bd'):$('#tt')).focus()},500);
}
function commit(){
  if(!cur)return;
  cur.title=$('#tt').value.replace(/\n/g,' ');cur.body=$('#bd').value;cur.updated=Date.now();
  if(cur.isNew){delete cur.isNew;notes.push(cur)}
  save();snap={t:cur.title,b:cur.body};$('#sv').textContent='Saved';
}
function closeEd(){cur=null;$('#ed').classList.remove('open');document.body.style.overflow='';render()}
async function leave(){
  if(!cur||resolveAsk)return;
  if(dirty()){
    const v=await ask('Save changes to this note?',[{l:'Save',v:'save',p:1},{l:'Discard',v:'discard'},{l:'Keep editing',v:'cancel'}]);
    if(v==='cancel')return;if(v==='save')commit();
  }
  closeEd();
}
function grow(){['#tt','#bd'].forEach(s=>{const e=$(s);e.style.height='auto';e.style.height=Math.max(e.scrollHeight,s==='#bd'?innerHeight*.5:0)+'px'})}
['#tt','#bd'].forEach(s=>$(s).addEventListener('input',()=>{grow();$('#sv').textContent=dirty()?'Unsaved':''}));
$('#tt').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#bd').focus()}});
$('#new').onclick=()=>open();
$('#back').onclick=leave;
$('#sav').onclick=commit;
$('#del').onclick=async()=>{
  if(!cur||resolveAsk)return;
  if(cur.isNew){closeEd();return}
  const v=await ask('Delete this note?',[{l:'Delete',v:'del',p:1},{l:'Cancel',v:'cancel'}]);
  if(v==='del'){notes=notes.filter(n=>n!==cur);save();closeEd()}
};
$('#q').addEventListener('input',render);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#chat').contains(document.activeElement)){if($('#emp').classList.contains('open'))$('#emp').classList.remove('open');else if(rep)setRep(null);else toggleChat(false);return}
  if(e.key==='Escape'){if(resolveAsk)resolveAsk();else if(cur)leave()}
  if((e.metaKey||e.ctrlKey)&&e.key==='s'&&cur){e.preventDefault();commit()}
});
addEventListener('beforeunload',e=>{if(cur&&dirty()){e.preventDefault();e.returnValue=''}});
/* custom drag-to-reorder */
let dragSt=null,dragged=false;
$('#list').addEventListener('click',e=>{if(dragged)return;const b=e.target.closest('.item');if(b)open(b.dataset.id)});
$('#list').addEventListener('pointerdown',e=>{
  if(sortMode!=='custom'||$('#q').value.trim()||e.button>0)return;
  const it=e.target.closest('.item');if(!it)return;
  const r=it.getBoundingClientRect();
  dragSt={it,sx:e.clientX,sy:e.clientY,gx:e.clientX-r.left,gy:e.clientY-r.top,on:false,id:e.pointerId,touch:e.pointerType==='touch',lock:0};
  if(dragSt.touch)dragSt.t=setTimeout(()=>{if(dragSt)startDrag()},260);
});
function startDrag(){const d=dragSt;if(!d||d.on)return;d.on=true;dragged=true;d.it.classList.add('drag');document.body.classList.add('dragging');try{d.it.setPointerCapture(d.id)}catch(e){}}
addEventListener('pointermove',e=>{
  const d=dragSt;if(!d)return;
  if(!d.on){
    if(Math.hypot(e.clientX-d.sx,e.clientY-d.sy)<=(d.touch?10:6))return;
    if(d.touch){clearTimeout(d.t);dragSt=null;return}
    startDrag();
  }
  const it=d.it,list=$('#list'),kids=[...list.children],others=kids.filter(k=>k!==it);
  if(performance.now()>d.lock){
    const tgt=others.find(k=>{const r=k.getBoundingClientRect();return e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom});
    if(tgt){
      const first=new Map(others.map(k=>[k,k.getBoundingClientRect()]));
      it.style.transform='';
      list.insertBefore(it,kids.indexOf(it)<kids.indexOf(tgt)?tgt.nextSibling:tgt);
      others.forEach(k=>{const a=first.get(k),b=k.getBoundingClientRect(),dx=a.left-b.left,dy=a.top-b.top;
        if(dx||dy)k.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:340,easing:'cubic-bezier(.16,1,.3,1)'})});
      d.lock=performance.now()+220;
    }
  }
  it.style.transform='';const r=it.getBoundingClientRect();
  it.style.transform=`translate(${e.clientX-d.gx-r.left}px,${e.clientY-d.gy-r.top}px) scale(1.04)`;
});
function endDrag(){
  const d=dragSt;if(!d)return;clearTimeout(d.t);dragSt=null;if(!d.on)return;
  const it=d.it,from=it.style.transform;it.style.transform='';
  it.animate([{transform:from},{transform:'none'}],{duration:380,easing:'cubic-bezier(.16,1,.3,1)'}).onfinish=()=>it.classList.remove('drag');
  document.body.classList.remove('dragging');
  [...$('#list').children].forEach((k,i)=>{const n=notes.find(x=>x.id===k.dataset.id);if(n)n.order=i});save();
  setTimeout(()=>{dragged=false},60);
}
addEventListener('pointerup',endDrag);addEventListener('pointercancel',endDrag);
document.addEventListener('touchmove',e=>{if(dragSt&&dragSt.on)e.preventDefault()},{passive:false});

/* cursor: squishy jelly ball */
const c=$('#cur');let x=0,y=0,tx=0,ty=0,ang=0,st=1,cp=1,pv=0,pt=1;
addEventListener('mousemove',e=>{tx=e.clientX;ty=e.clientY;c.style.opacity=1});
addEventListener('mousedown',()=>{pt=.45});
addEventListener('mouseup',()=>{pt=1});
(function loop(){
  const vx=(tx-x)*.16,vy=(ty-y)*.16;x+=vx;y+=vy;
  const sp=Math.hypot(vx,vy);
  if(sp>.4)ang=Math.atan2(vy,vx);
  st+=(1+Math.min(sp*.09,1.6)-st)*.2;
  pv+=(pt-cp)*.3;pv*=.72;cp+=pv;
  const sx=st*cp*(1+(1-cp)*.7),sy=cp/Math.sqrt(st);
  c.style.transform=`translate(${x}px,${y}px) rotate(${ang}rad) scale(${sx},${sy})`;
  requestAnimationFrame(loop);
})();
document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-c]');if(t&&t.closest('#ed')===null)c.classList.add('big');else c.classList.remove('big')});
/* slime splat: brief, subtle liquid particles */
const fx=$('#fx'),g=fx.getContext('2d');let P=[],run=false,lt=0,dpr=1;
function fit(){dpr=Math.min(devicePixelRatio||1,2);fx.width=innerWidth*dpr;fx.height=innerHeight*dpr;g.setTransform(dpr,0,0,dpr,0,0)}
fit();addEventListener('resize',fit);
function splat(x,y){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const n=5+(Math.random()*2|0);
  for(let i=0;i<n;i++){const a=Math.random()*6.283,s=(2.2+Math.random()*4.8)*.8,glop=i<1;
    P.push({x,y,ox:x,oy:y,vx:Math.cos(a)*s*(glop?.6:1),vy:Math.sin(a)*s*(glop?.6:1)-1,r:glop?3.4+Math.random()*1.4:1.3+Math.random()*2.2,t:0,max:glop?260:150+Math.random()*120,glop})}
  if(!run){run=true;lt=performance.now();requestAnimationFrame(tick)}
}
function tick(now){
  const dt=Math.min((now-lt)/16.7,3);lt=now;g.clearRect(0,0,innerWidth,innerHeight);g.fillStyle=g.strokeStyle='#fff';g.globalAlpha=.5;
  P=P.filter(p=>p.t<p.max);
  for(const p of P){
    p.t+=dt*16.7;p.vy+=.26*dt;p.vx*=Math.pow(.96,dt);p.x+=p.vx*dt;p.y+=p.vy*dt;
    const k=1-p.t/p.max,r=p.r*(.3+k*.7),sp=Math.hypot(p.vx,p.vy),sx=1+Math.min(sp*.1,1.3);
    if(p.glop&&k>.55){g.lineWidth=r*1.1*(k-.5)*2;g.lineCap='round';g.beginPath();g.moveTo(p.ox,p.oy);g.lineTo(p.x,p.y);g.stroke()}
    g.save();g.translate(p.x,p.y);g.rotate(Math.atan2(p.vy,p.vx));g.beginPath();g.ellipse(0,0,r*sx,r/Math.sqrt(sx),0,0,6.283);g.fill();g.restore();
  }
  if(P.length)requestAnimationFrame(tick);else{run=false;g.clearRect(0,0,innerWidth,innerHeight)}
}

const AL={heart:'love',moon:'sleepy',spark:'star',drop:'sweat',flame:'angry',cloud:'sad',cat:'happy',bolt:'shock',coffee:'sleepy',pizza:'tongue',ufo:'think',eye:'shock',rainbow:'party',skull:'dizzy',cactus:'wave'};
const EN=Object.keys(EJ),rn=n=>EJ[n]?n:AL[n];
const svg=n=>{const k=rn(n);return `<svg class="ej e-${k}" viewBox="0 0 32 32" style="--d:${-(Math.random()*4).toFixed(1)}s" aria-label="${k}">${EJ[k]}</svg>`};
const rich=t=>esc(t).replace(/:([a-z]+):/g,(m,n)=>rn(n)?svg(n):m);
const onlyEj=t=>{const k=t.match(/:[a-z]+:/g)||[];return k.length>0&&k.length<=3&&k.every(s=>rn(s.slice(1,-1)))&&!t.replace(/:[a-z]+:/g,'').trim()};
$('#emb').innerHTML=svg('blob');
$('#emg').innerHTML=EN.map((n,i)=>`<button data-e="${n}" style="--i:${i}" aria-label="${n}" title="${n}">${svg(n)}</button>`).join('');
/* watch-style lens on emoji picker */
const eg=$('#emg');
let rafId=null;

function lens(e){
  if(rafId)cancelAnimationFrame(rafId);
  rafId=requestAnimationFrame(()=>{
    for(const b of eg.children){
      const r=b.getBoundingClientRect();
      const cx=r.left+r.width/2;
      const cy=r.top+r.height/2;
      const dx=e.clientX-cx;
      const dy=e.clientY-cy;
      const d=Math.hypot(dx,dy);
      
      // Exponential falloff - tighter influence radius
      const sigma=70;
      const k=Math.max(0,Math.exp(-(d*d)/(2*sigma*sigma)));
      
      // ✨ BASE IS 1.0 — far emojis stay natural size, nearby ones GROW
      const scale=1+k*1.15;
      
      // 3D tilt only affects nearby emojis (multiplied by k)
      const maxTilt=24;
      const tiltX=Math.max(-maxTilt,Math.min(maxTilt,-dy*.18))*k;
      const tiltY=Math.max(-maxTilt,Math.min(maxTilt,dx*.18))*k;
      
      const svg=b.firstChild;
      if(svg){
        svg.style.transform=`translateZ(0) rotateX(${tiltX}deg) rotateY(${tiltY}deg) scale(${scale})`;
        
        // Shadow only appears when emoji is being magnified
        if(k>0.1){
          const shadowBlur=3+k*14;
          const shadowY=1+k*8;
          const shadowAlpha=0.1+k*0.5;
          svg.style.filter=`drop-shadow(0 ${shadowY}px ${shadowBlur}px rgba(0,0,0,${shadowAlpha}))`;
        } else {
          svg.style.filter='';
        }
        
        svg.style.zIndex=Math.round(scale*100);
      }
    }
  });
}

function unlens(){
  if(rafId){
    cancelAnimationFrame(rafId);
    rafId=null;
  }
  for(const b of eg.children){
    const svg=b.firstChild;
    if(svg){
      svg.style.transform='';
      svg.style.filter='';
      svg.style.zIndex='';
    }
  }
}

eg.addEventListener('pointermove',lens);
eg.addEventListener('pointerdown',lens);
eg.addEventListener('pointerleave',unlens);
eg.addEventListener('pointercancel',unlens);
/* chat */
let db=null,room=null,me=null,msgs=[],seenIds=new Set(),firstLoad=true,chatOpen=false,lastSeen=0,localMode=true,peerRead=0,sentRead=0,rep=null,lastTheirId=null;
const MAXM=100;
try{lastSeen=+localStorage.getItem('chat-seen')||0}catch(e){}
const stamp=t=>{const d=new Date(t),tm=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});return d.toDateString()===new Date().toDateString()?tm:d.toLocaleDateString([],{weekday:'short',day:'numeric',month:'short'})+' · '+tm};
/* resizable chat */
let cw=400;try{cw=+localStorage.getItem('chat-w')||400}catch(e){}
function setCW(w){cw=Math.max(300,Math.min(w,innerWidth*.7));if(innerWidth>760)document.body.style.setProperty('--cwo',cw+'px');else document.body.style.removeProperty('--cwo');if(cur)grow()}
const gr=$('#grip');
gr.addEventListener('pointerdown',e=>{if(innerWidth<=760)return;e.preventDefault();try{gr.setPointerCapture(e.pointerId)}catch(_){}document.body.classList.add('resizing','dragging');gr.classList.add('on')});
gr.addEventListener('pointermove',e=>{if(document.body.classList.contains('resizing'))setCW(e.clientX)});
function endR(){if(!document.body.classList.contains('resizing'))return;document.body.classList.remove('resizing','dragging');gr.classList.remove('on');try{localStorage.setItem('chat-w',Math.round(cw))}catch(_){}}
gr.addEventListener('pointerup',endR);gr.addEventListener('pointercancel',endR);
addEventListener('resize',()=>setCW(cw));
function badge(){
  const n=chatOpen?0:msgs.filter(m=>m.from!==me&&m.ts>lastSeen).length,u=$('#unr');
  u.textContent=n>9?'9+':n;u.classList.toggle('on',n>0);
}
function markRead(){if(!msgs.length)return;lastSeen=Math.max(lastSeen,...msgs.map(m=>m.ts));try{localStorage.setItem('chat-seen',lastSeen)}catch(e){}badge()}
/* seen receipts: only when this tab is visible AND chat is open */
function pushRead(){
  if(!db||!chatOpen||document.visibilityState!=='visible')return;
  const t=Math.max(0,...msgs.filter(m=>m.from!==me).map(m=>m.ts));
  if(t>sentRead){sentRead=t;try{Promise.resolve(db.collection('reads').doc(me).set({ts:t})).catch(()=>{})}catch(e){}}
}
function updTicks(){document.querySelectorAll('#ml .tk').forEach(t=>t.classList.toggle('seen',peerRead>=+t.dataset.ts))}
const TK='<svg viewBox="0 0 18 12"><path d="M1 6.500l3.500 3.500L11 2.500M7 9.500l.9.9L16 2.500"/></svg>';
const tk=ts=>`<i class="tk${peerRead>=ts?' seen':''}" data-ts="${ts}">${TK}</i>`;
function renderChat(){
  const box=$('#msgs'),near=box.scrollHeight-box.scrollTop-box.clientHeight<140,wasFirst=firstLoad;
  let h='',prev=null;
  msgs.forEach((m,i)=>{
    const gap=!prev||m.ts-prev.ts>9e5,nx=msgs[i+1],mine=m.from===me;
    const first=gap||prev.from!==m.from,tail=!nx||nx.from!==m.from||nx.ts-m.ts>9e5;
    const q=m.reply&&typeof m.reply.text==='string'?`<div class="q" data-r="${esc(String(m.reply.id))}"><b>${m.reply.from===me?'You':'Them'}</b><span>${rich(String(m.reply.text).slice(0,140))}</span></div>`:'';
    if(gap)h+=`<div class="ts">${stamp(m.ts)}</div>`;
    h+=`<div class="row ${mine?'mine':'theirs'}${first?' first':''}${tail?' tail':''}${rep&&rep.id===m.id?' sel':''}" data-id="${esc(String(m.id))}"><div class="m${onlyEj(m.text)&&!q?' big':''}${!wasFirst&&!seenIds.has(m.id)?' new':''}" data-c="1">${q}${rich(m.text)}${mine&&tail?tk(m.ts):''}</div></div>`;
    prev=m;
  });
  $('#ml').innerHTML=h;box.classList.toggle('rp',!!rep);msgs.forEach(m=>seenIds.add(m.id));firstLoad=false;
  if(near||wasFirst||(msgs.length&&msgs[msgs.length-1].from===me))box.scrollTo({top:box.scrollHeight,behavior:wasFirst?'auto':'smooth'});
}
function onMsgs(){
  const l=[...msgs].reverse().find(m=>m.from!==me);if(l&&l.id!==lastTheirId){lastTheirId=l.id;setTyp(false)}
  renderChat();if(chatOpen){markRead();pushRead()}else badge();
}
/* reply */
function setRep(m){
  rep=m?{id:m.id,from:m.from,text:m.text.slice(0,140)}:null;
  const b=$('#rbar');b.classList.toggle('on',!!rep);
  if(rep){b.querySelector('b').textContent=rep.from===me?'Replying to yourself':'Replying to them';b.querySelector('span').innerHTML=rich(rep.text);$('#cin').focus({preventScroll:true})}
  $('#msgs').classList.toggle('rp',!!rep);
  document.querySelectorAll('#ml .row').forEach(r=>r.classList.toggle('sel',!!rep&&r.dataset.id===String(rep.id)));
}
$('#rx').onclick=()=>setRep(null);
$('#msgs').addEventListener('click',e=>{
  const q=e.target.closest('.q');
  if(q){const t=[...document.querySelectorAll('#ml .row')].find(r=>r.dataset.id===q.dataset.r);if(t){t.scrollIntoView({block:'center',behavior:'smooth'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash');setTimeout(()=>t.classList.remove('flash'),1200)}return}
  const r=e.target.closest('.row[data-id]');if(!r)return;
  const m=msgs.find(x=>String(x.id)===r.dataset.id);if(!m)return;
  setRep(rep&&String(rep.id)===String(m.id)?null:m);
});
/* typing */
let typTO,lastTE=0,peerTO;
function emitTyp(on){if(!room)return;const n=Date.now();if(on){if(n-lastTE<2000)return;lastTE=n}else lastTE=0;try{Promise.resolve(room.emit('typing',{from:me,on})).catch(()=>{})}catch(e){}}
function typing(){const has=!!$('#cin').value.trim();emitTyp(has);clearTimeout(typTO);if(has)typTO=setTimeout(()=>emitTyp(false),3000)}
function setTyp(on){
  const t=$('#typ'),box=$('#msgs'),near=box.scrollHeight-box.scrollTop-box.clientHeight<140;
  clearTimeout(peerTO);
  if(on){if(!t.classList.contains('on')){t.classList.add('on');if(near)box.scrollTo({top:box.scrollHeight,behavior:'smooth'})}peerTO=setTimeout(()=>t.classList.remove('on'),4500)}
  else t.classList.remove('on');
}
function toggleChat(f){
  chatOpen=f===undefined?!chatOpen:f;document.body.classList.toggle('chat',chatOpen);
  if(chatOpen){markRead();pushRead();setTimeout(()=>{$('#cin').focus({preventScroll:true});const b=$('#msgs');b.scrollTop=b.scrollHeight},650)}
  else{$('#emp').classList.remove('open');$('#cin').blur();emitTyp(false);badge()}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&chatOpen){markRead();pushRead()}});
$('#chatbtn').onclick=()=>toggleChat();
function fitIn(){const t=$('#cin');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,110)+'px';$('#snd').disabled=!t.value.trim()}
$('#cin').addEventListener('input',()=>{fitIn();typing()});
$('#cin').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});
$('#snd').onclick=send;
async function send(){
  const ta=$('#cin'),t=ta.value.trim().slice(0,2000);if(!t)return;
  clearTimeout(typTO);emitTyp(false);
  ta.value='';fitIn();const s=$('#snd');s.classList.remove('go');void s.offsetWidth;s.classList.add('go');
  const msg={from:me,text:t,ts:Date.now()};if(rep)msg.reply={id:String(rep.id),from:rep.from,text:rep.text};
  if(!db){msg.id='l'+uid();msgs.push(msg);if(msgs.length>MAXM)msgs=msgs.slice(-MAXM);setRep(null);onMsgs();return}
  try{await db.collection('chat').add(msg);setRep(null)}
  catch(e){ta.value=t;fitIn();const p=$('.pill');p.classList.remove('shake');void p.offsetWidth;p.classList.add('shake')}
}
$('#emb').onclick=e=>{e.stopPropagation();unlens();$('#emp').classList.toggle('open')};
$('#emp').addEventListener('click',e=>{
  const b=e.target.closest('[data-e]');if(!b)return;
  const ta=$('#cin');ta.setRangeText(`:${b.dataset.e}:`,ta.selectionStart,ta.selectionEnd,'end');fitIn();typing();ta.focus({preventScroll:true});
});
document.addEventListener('click',e=>{if(!e.target.closest('#emp'))$('#emp').classList.remove('open')});
async function initChat(){
  me='local';
  try{
    if(!window.claude||!claude.use)throw 0;
    const [d,u]=await Promise.all([claude.use('db'),claude.use('user')]);
    const id=u?await u.id():null;
    if(d&&id){
      db=d;me=id;localMode=false;
      db.collection('chat').orderBy('ts','desc').limit(MAXM).onSnapshot(s=>{
        msgs=s.docs.map(x=>({id:x.id,...x.data()})).filter(m=>typeof m.text==='string'&&typeof m.from==='string'&&typeof m.ts==='number').reverse().slice(-MAXM);
        onMsgs();
      },()=>{});
      db.collection('reads').onSnapshot(s=>{
        let p=0;s.docs.forEach(x=>{if(x.id!==me){const t=x.data().ts;if(typeof t==='number')p=Math.max(p,t)}});
        if(p!==peerRead){peerRead=p;updTicks()}
      },()=>{});
      claude.use('room').then(r=>{if(!r)return;room=r;r.on('typing',m=>{if(m.isMe||!m.data||m.data.from===me)return;setTyp(!!m.data.on)})}).catch(()=>{});
    }
  }catch(e){}
  renderChat();
}
initChat();
setCW(cw);setSize(size);applyTab();render();
document.querySelectorAll('.bar').forEach(b=>b.addEventListener('animationend',()=>b.classList.remove('reveal'),{once:true}));
</script>
